<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Faz a página se ajustar à tela do celular -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075985">
<title>Registro de Tempo de Atividades</title>

<!-- Biblioteca que cria arquivos Excel (SheetJS). Carrega da internet -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* =====================================================
   PARTE 1 - ESTILO (CSS): aqui ficam as cores e o visual
   ===================================================== */

/* Cores do app (tons hospitalares: azul e verde-água).
   Para mudar uma cor, mude aqui. */
:root {
  --fundo: #eef4f8;
  --card: #ffffff;
  --texto: #0f2a3d;
  --cinza: #5b7083;
  --borda: #d9e5ee;
  --principal: #0369a1;    /* azul dos botões */
  --escuro: #075985;       /* azul escuro do topo */
  --ativo: #0d9488;        /* verde-água de quando está rodando */
  --parar: #dc2626;        /* vermelho do botão Parar */
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 16px;
}

/* Tamanho padrão de todos os ícones */
.icone { width: 22px; height: 22px; flex-shrink: 0; }

/* ----- Barra do topo (fica fixa ao rolar a página) ----- */
header {
  position: sticky;
  top: 0;
  z-index: 10;
  overflow: hidden;
  background: linear-gradient(135deg, #075985, #0e7490);
  color: white;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 10px rgba(7, 89, 133, 0.35);
}
/* Linha de batimento cardíaco decorativa no fundo do topo */
.eletro {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  width: 100%; height: 34px;
  opacity: 0.18;
}
.logo {
  position: relative;
  width: 42px; height: 42px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.18);
  display: flex; align-items: center; justify-content: center;
}
.logo .icone { width: 26px; height: 26px; }
.titulos { position: relative; flex: 1; }
.titulos h1 { font-size: 16px; line-height: 1.2; margin: 0; }
.titulos small { font-size: 12px; opacity: 0.85; }

/* ----- Botões ----- */
button {
  font-family: inherit;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  padding: 10px 14px;
  color: white;
  background: var(--principal);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
header button { position: relative; background: white; color: var(--escuro); font-weight: 600; font-size: 14px; }

/* Botão sem fundo (usado no lápis, lixeira e X) */
.botao-simples { background: transparent; color: var(--cinza); padding: 8px; }
.botao-simples .icone { width: 18px; height: 18px; }

main { padding: 14px; max-width: 560px; margin: 0 auto; }

/* ----- Campo da referência ----- */
.rotulo { font-size: 12px; font-weight: 600; color: var(--cinza); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 2px 6px; }
#campoReferencia {
  width: 100%;
  padding: 13px;
  margin-bottom: 16px;
  font-size: 16px;
  color: var(--texto);
  background: white;
  border: 1px solid var(--borda);
  border-radius: 12px;
}
#campoReferencia:focus { outline: 2px solid var(--principal); }

/* ----- Cartão de cada atividade ----- */
.cartao {
  background: var(--card);
  border: 1px solid var(--borda);
  border-left: 5px solid var(--borda);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(15, 42, 61, 0.06);
}
/* Quando está rodando: borda verde-água e fundo levemente colorido */
.cartao.rodando { border-left-color: var(--ativo); background: #f0fdfa; }

.linha-titulo { display: flex; align-items: center; gap: 10px; }
/* Quadradinho colorido onde fica o ícone da atividade */
.caixa-icone {
  width: 40px; height: 40px;
  border-radius: 11px;
  background: #e0f2fe;
  color: var(--principal);
  display: flex; align-items: center; justify-content: center;
}
.cartao.rodando .caixa-icone { background: var(--ativo); color: white; }
.nome { flex: 1; font-weight: 600; }

/* Etiqueta "Parado" / "Em andamento" */
.etiqueta { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--cinza); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.cartao.rodando .etiqueta { color: var(--ativo); }
.bolinha { width: 8px; height: 8px; border-radius: 50%; background: #b6c4d0; }
.cartao.rodando .bolinha { background: var(--ativo); animation: piscar 1s infinite; }
@keyframes piscar { 50% { opacity: 0.25; } }

/* Números grandes do cronômetro */
.tempo { font-size: 38px; font-weight: 700; margin: 2px 0 4px; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.cartao.rodando .tempo { color: var(--ativo); }

.estatistica { color: var(--cinza); font-size: 13px; }

/* Botão grande Iniciar/Parar */
.botao-grande { width: 100%; font-size: 17px; font-weight: 600; padding: 14px; margin-top: 10px; }
.cartao.rodando .botao-grande { background: var(--parar); }

.botao-adicionar {
  width: 100%;
  background: white;
  color: var(--principal);
  border: 2px dashed #9cc7e0;
  font-weight: 600;
}

/* ----- Lista de registros ----- */
.cabecalho-registros { display: flex; align-items: center; justify-content: space-between; margin: 22px 2px 8px; }
.cabecalho-registros h2 { font-size: 15px; margin: 0; color: var(--texto); }
.registro { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--borda); font-size: 14px; }
.registro:last-child { border-bottom: none; }
.registro .info { flex: 1; }
.registro .duracao { font-weight: 700; font-variant-numeric: tabular-nums; }
.mini-icone { width: 32px; height: 32px; border-radius: 9px; background: #e0f2fe; color: var(--principal); display: flex; align-items: center; justify-content: center; }
.mini-icone .icone { width: 17px; height: 17px; }

.rodape { text-align: center; color: var(--cinza); font-size: 12px; padding: 18px 0 28px; }
</style>
</head>

<body>

<!-- =====================================================
     PARTE 2 - ESTRUTURA DA PÁGINA (HTML)
     Aqui só ficam as "caixas vazias". O JavaScript
     preenche elas depois.
     ===================================================== -->

<header>
  <!-- Linha de batimento cardíaco (só enfeite) -->
  <svg class="eletro" viewBox="0 0 400 34" preserveAspectRatio="none">
    <polyline points="0,20 90,20 105,20 115,4 128,32 138,14 148,20 260,20 275,20 285,4 298,32 308,14 318,20 400,20"
              fill="none" stroke="white" stroke-width="2"/>
  </svg>

  <!-- Logo: cruz da saúde -->
  <div class="logo">
    <svg class="icone" viewBox="0 0 24 24" fill="white"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>
  </div>

  <div class="titulos">
    <h1>Registro de Tempo de Atividades</h1>
    <small>Engenharia Clínica</small>
  </div>

  <button id="botaoExportar">
    <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
    Excel
  </button>
</header>

<main>
  <!-- Campo opcional para identificar o que está sendo medido -->
  <p class="rotulo">Referência do registro</p>
  <input id="campoReferencia" type="text" placeholder="Opcional: nº do equipamento, setor..." autocomplete="off">

  <!-- Aqui o JavaScript desenha os cartões das atividades -->
  <div id="listaAtividades"></div>

  <button id="botaoAdicionar" class="botao-adicionar">
    <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    Adicionar atividade
  </button>

  <div class="cabecalho-registros">
    <h2>Registros (<span id="totalRegistros">0</span>)</h2>
    <button id="botaoLimpar" class="botao-simples" title="Limpar todos os registros">
      <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
      Limpar
    </button>
  </div>

  <!-- Aqui o JavaScript desenha a lista de registros -->
  <div id="listaRegistros" class="cartao"></div>

  <div class="rodape">Registro de Tempo de Atividades · Engenharia Clínica</div>
</main>


<script>
/* =====================================================
   PARTE 3 - JAVASCRIPT (a lógica do app)
   Está dividido em seções numeradas para facilitar.
   ===================================================== */


/* ---------- SEÇÃO 1: VARIÁVEIS (onde guardamos os dados) ---------- */

// Nome com o qual salvamos os dados no navegador
var NOME_DO_SALVAMENTO = "cronometros_dados";

// Atividades que já vêm prontas. Pode mudar os nomes aqui se quiser.
var atividadesPadrao = [
  "Calibração",
  "Preventiva",
  "TSE",
  "Entrega do equipamento",
  "Espera no elevador",
  "Instalação do equipamento",
  "Retorno ao setor"
];

// "dados" guarda TUDO do app:
//   atividades -> lista das atividades (cada uma tem id, nome e inicio)
//   registros  -> lista dos tempos já medidos
//   referencia -> o texto do campo de referência
//   proximoId  -> número para dar a uma nova atividade
// Se "inicio" for null, o cronômetro está parado.
// Se tiver um número, é a hora (em milissegundos) em que ele começou.
var dados = {
  atividades: [],
  registros: [],
  referencia: "",
  proximoId: 1
};


/* ---------- SEÇÃO 2: ÍCONES ---------- */

// Cada ícone é um desenho SVG. Aqui guardamos só o "miolo" do desenho.
var ICONES = {
  relogio:     '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  calibracao:  '<path d="M3 16a9 9 0 0 1 18 0"/><path d="M12 16l4-6"/><circle cx="12" cy="16" r="1"/>',
  preventiva:  '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  entrega:     '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>',
  elevador:    '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 3v18"/><path d="M7 10l1.5-2L10 10"/><path d="M14 14l1.5 2 1.5-2"/>',
  instalacao:  '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="M6 11h3l1.5-3 2 6 1.5-3h4"/>',
  retorno:     '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  editar:      '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  lixeira:     '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
  fechar:      '<path d="M18 6L6 18M6 6l12 12"/>',
  iniciar:     '<polygon points="6 4 20 12 6 20"/>',
  parar:       '<rect x="6" y="6" width="12" height="12" rx="1"/>'
};

// Monta o desenho completo do ícone (com tamanho, cor e espessura da linha)
function desenharIcone(nomeDoIcone) {
  return '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
         ICONES[nomeDoIcone] + '</svg>';
}

// Escolhe o ícone certo olhando para o NOME da atividade.
// Se não reconhecer nenhuma palavra, usa o relógio.
function escolherIcone(nomeAtividade) {
  var nome = nomeAtividade.toLowerCase();

  if (nome.indexOf("calib") !== -1)   { return "calibracao"; }
  if (nome.indexOf("prevent") !== -1) { return "preventiva"; }
  if (nome.indexOf("entrega") !== -1) { return "entrega"; }
  if (nome.indexOf("elevador") !== -1){ return "elevador"; }
  if (nome.indexOf("instala") !== -1) { return "instalacao"; }
  if (nome.indexOf("retorno") !== -1) { return "retorno"; }
  return "relogio";
}


/* ---------- SEÇÃO 3: SALVAR E CARREGAR ---------- */

// Salva os dados no navegador (para não perder ao fechar a página)
function salvarDados() {
  try {
    localStorage.setItem(NOME_DO_SALVAMENTO, JSON.stringify(dados));
  } catch (erro) {
    // Se der erro, o app continua funcionando, só não salva
  }
}

// Carrega os dados salvos. Se não existir nada salvo, cria as atividades padrão.
function carregarDados() {
  var textoSalvo = null;
  try {
    textoSalvo = localStorage.getItem(NOME_DO_SALVAMENTO);
  } catch (erro) {
    textoSalvo = null;
  }

  if (textoSalvo !== null) {
    // Já tinha dados salvos: usa eles
    dados = JSON.parse(textoSalvo);
  } else {
    // Primeira vez: cria as atividades padrão
    for (var i = 0; i < atividadesPadrao.length; i++) {
      dados.atividades.push({
        id: dados.proximoId,
        nome: atividadesPadrao[i],
        inicio: null
      });
      dados.proximoId = dados.proximoId + 1;
    }
  }
}


/* ---------- SEÇÃO 4: FUNÇÕES AUXILIARES ---------- */

// Coloca um zero na frente se o número for menor que 10 (5 vira "05")
function doisDigitos(numero) {
  if (numero < 10) {
    return "0" + numero;
  }
  return "" + numero;
}

// Transforma milissegundos em texto "mm:ss" (ou "h:mm:ss" se passar de 1 hora)
function formatarTempo(milissegundos) {
  var totalSegundos = Math.floor(milissegundos / 1000);
  var horas = Math.floor(totalSegundos / 3600);
  var minutos = Math.floor((totalSegundos % 3600) / 60);
  var segundos = totalSegundos % 60;

  if (horas > 0) {
    return horas + ":" + doisDigitos(minutos) + ":" + doisDigitos(segundos);
  }
  return doisDigitos(minutos) + ":" + doisDigitos(segundos);
}

// Transforma uma hora (em milissegundos) em texto "dd/mm/aaaa"
function formatarData(milissegundos) {
  var d = new Date(milissegundos);
  return doisDigitos(d.getDate()) + "/" + doisDigitos(d.getMonth() + 1) + "/" + d.getFullYear();
}

// Transforma uma hora (em milissegundos) em texto "hh:mm:ss"
function formatarHora(milissegundos) {
  var d = new Date(milissegundos);
  return doisDigitos(d.getHours()) + ":" + doisDigitos(d.getMinutes()) + ":" + doisDigitos(d.getSeconds());
}

// Evita que símbolos como < e > quebrem a página quando digitados em um nome
function limparTexto(texto) {
  texto = String(texto);
  texto = texto.replace(/&/g, "&amp;");
  texto = texto.replace(/</g, "&lt;");
  texto = texto.replace(/>/g, "&gt;");
  texto = texto.replace(/"/g, "&quot;");
  return texto;
}

// Procura uma atividade pelo id e devolve ela
function buscarAtividade(id) {
  for (var i = 0; i < dados.atividades.length; i++) {
    if (dados.atividades[i].id === id) {
      return dados.atividades[i];
    }
  }
  return null;
}

// Calcula contagem, média, mínimo, máximo e total de uma atividade.
// Devolve null se ela ainda não tem nenhum registro.
function calcularEstatisticas(nomeAtividade) {
  var quantidade = 0;
  var soma = 0;
  var menor = 0;
  var maior = 0;

  for (var i = 0; i < dados.registros.length; i++) {
    var registro = dados.registros[i];

    if (registro.atividade === nomeAtividade) {
      var duracao = registro.fim - registro.inicio;

      // No primeiro registro, menor e maior começam iguais à duração
      if (quantidade === 0) {
        menor = duracao;
        maior = duracao;
      }
      if (duracao < menor) { menor = duracao; }
      if (duracao > maior) { maior = duracao; }

      soma = soma + duracao;
      quantidade = quantidade + 1;
    }
  }

  if (quantidade === 0) {
    return null;
  }
  return {
    quantidade: quantidade,
    media: soma / quantidade,
    menor: menor,
    maior: maior,
    total: soma
  };
}


/* ---------- SEÇÃO 5: INICIAR E PARAR CRONÔMETROS ---------- */

// Para UMA atividade: guarda o tempo medido na lista de registros
function pararAtividade(atividade) {
  // Só faz algo se ela estiver rodando
  if (atividade.inicio !== null) {
    dados.registros.push({
      atividade: atividade.nome,
      referencia: dados.referencia,
      inicio: atividade.inicio,
      fim: Date.now()          // Date.now() = hora de agora
    });
    atividade.inicio = null;   // null = parado
  }
}

// Inicia UMA atividade. Antes, PARA todas as outras que estiverem rodando.
function iniciarAtividade(atividade) {
  for (var i = 0; i < dados.atividades.length; i++) {
    var outra = dados.atividades[i];
    if (outra.id !== atividade.id) {
      pararAtividade(outra);   // para as outras automaticamente
    }
  }
  atividade.inicio = Date.now();
}

// Chamada quando clica no botão grande: se está rodando para, senão inicia
function clicouNoBotao(id) {
  var atividade = buscarAtividade(id);

  if (atividade.inicio !== null) {
    pararAtividade(atividade);
  } else {
    iniciarAtividade(atividade);
  }

  salvarDados();
  desenharTudo();

  // Faz o celular vibrar um pouquinho (se tiver suporte)
  if (navigator.vibrate) {
    navigator.vibrate(40);
  }
}


/* ---------- SEÇÃO 6: DESENHAR NA TELA ---------- */

// Monta o HTML dos cartões das atividades
function desenharAtividades() {
  var html = "";

  for (var i = 0; i < dados.atividades.length; i++) {
    var a = dados.atividades[i];
    var stats = calcularEstatisticas(a.nome);

    // Valores para quando o cronômetro está PARADO
    var classe = "cartao";
    var textoEtiqueta = "Parado";
    var botaoIcone = "iniciar";
    var textoBotao = "Iniciar";
    var tempoAtual = 0;

    // Valores para quando está RODANDO
    if (a.inicio !== null) {
      classe = "cartao rodando";
      textoEtiqueta = "Em andamento";
      botaoIcone = "parar";
      textoBotao = "Parar";
      tempoAtual = Date.now() - a.inicio;
    }

    // Texto com as estatísticas
    var textoStats = "Sem registros";
    if (stats !== null) {
      textoStats = stats.quantidade + " registro(s) · média " + formatarTempo(stats.media) +
                   " · mín " + formatarTempo(stats.menor) + " · máx " + formatarTempo(stats.maior);
    }

    // Monta o cartão juntando pedaços de texto
    html = html + '<div class="' + classe + '">';
    html = html + '  <div class="linha-titulo">';
    html = html + '    <div class="caixa-icone">' + desenharIcone(escolherIcone(a.nome)) + '</div>';
    html = html + '    <span class="nome">' + limparTexto(a.nome) + '</span>';
    html = html + '    <button class="botao-simples" onclick="renomearAtividade(' + a.id + ')">' + desenharIcone("editar") + '</button>';
    html = html + '    <button class="botao-simples" onclick="removerAtividade(' + a.id + ')">' + desenharIcone("lixeira") + '</button>';
    html = html + '  </div>';
    html = html + '  <div class="etiqueta"><span class="bolinha"></span>' + textoEtiqueta + '</div>';
    html = html + '  <div class="tempo" id="tempo' + a.id + '">' + formatarTempo(tempoAtual) + '</div>';
    html = html + '  <div class="estatistica">' + textoStats + '</div>';
    html = html + '  <button class="botao-grande" onclick="clicouNoBotao(' + a.id + ')">' + desenharIcone(botaoIcone) + textoBotao + '</button>';
    html = html + '</div>';
  }

  document.getElementById("listaAtividades").innerHTML = html;
}

// Monta o HTML da lista de registros (o mais recente aparece primeiro)
function desenharRegistros() {
  var html = "";
  var total = dados.registros.length;

  document.getElementById("totalRegistros").textContent = total;

  if (total === 0) {
    html = '<div class="estatistica">Nenhum registro ainda</div>';
  }

  // Percorre a lista de trás para frente
  for (var i = total - 1; i >= 0; i--) {
    var r = dados.registros[i];

    var titulo = limparTexto(r.atividade);
    if (r.referencia !== "") {
      titulo = titulo + " · " + limparTexto(r.referencia);
    }

    html = html + '<div class="registro">';
    html = html + '  <div class="mini-icone">' + desenharIcone(escolherIcone(r.atividade)) + '</div>';
    html = html + '  <div class="info"><b>' + titulo + '</b><br>';
    html = html + '    <span class="estatistica">' + formatarData(r.inicio) + ' ' +
                  formatarHora(r.inicio) + ' → ' + formatarHora(r.fim) + '</span></div>';
    html = html + '  <span class="duracao">' + formatarTempo(r.fim - r.inicio) + '</span>';
    html = html + '  <button class="botao-simples" onclick="apagarRegistro(' + i + ')">' + desenharIcone("fechar") + '</button>';
    html = html + '</div>';
  }

  document.getElementById("listaRegistros").innerHTML = html;
}

// Redesenha tudo na tela
function desenharTudo() {
  document.getElementById("campoReferencia").value = dados.referencia;
  desenharAtividades();
  desenharRegistros();
}

// Atualiza SÓ os números dos cronômetros que estão rodando.
// É chamada várias vezes por segundo (veja a Seção 9).
function atualizarNumeros() {
  for (var i = 0; i < dados.atividades.length; i++) {
    var a = dados.atividades[i];
    if (a.inicio !== null) {
      var elemento = document.getElementById("tempo" + a.id);
      if (elemento !== null) {
        elemento.textContent = formatarTempo(Date.now() - a.inicio);
      }
    }
  }
}


/* ---------- SEÇÃO 7: ATIVIDADES E REGISTROS (adicionar, editar, apagar) ---------- */

// Adiciona uma atividade nova
function adicionarAtividade() {
  var nome = prompt("Nome da nova atividade:");

  if (nome !== null && nome.trim() !== "") {
    dados.atividades.push({
      id: dados.proximoId,
      nome: nome.trim(),
      inicio: null
    });
    dados.proximoId = dados.proximoId + 1;
    salvarDados();
    desenharTudo();
  }
}

// Muda o nome de uma atividade (e dos registros antigos dela também)
function renomearAtividade(id) {
  var atividade = buscarAtividade(id);
  var novoNome = prompt("Novo nome da atividade:", atividade.nome);

  if (novoNome !== null && novoNome.trim() !== "") {
    novoNome = novoNome.trim();

    // Atualiza o nome nos registros antigos para continuarem ligados a ela
    for (var i = 0; i < dados.registros.length; i++) {
      if (dados.registros[i].atividade === atividade.nome) {
        dados.registros[i].atividade = novoNome;
      }
    }
    atividade.nome = novoNome;
    salvarDados();
    desenharTudo();
  }
}

// Remove uma atividade da tela (os registros já feitos continuam guardados)
function removerAtividade(id) {
  var atividade = buscarAtividade(id);

  if (confirm('Remover "' + atividade.nome + '"? Os registros já feitos serão mantidos.')) {
    var novaLista = [];
    for (var i = 0; i < dados.atividades.length; i++) {
      if (dados.atividades[i].id !== id) {
        novaLista.push(dados.atividades[i]);
      }
    }
    dados.atividades = novaLista;
    salvarDados();
    desenharTudo();
  }
}

// Apaga um registro específico (pela posição dele na lista)
function apagarRegistro(posicao) {
  if (confirm("Apagar este registro?")) {
    dados.registros.splice(posicao, 1);   // splice remove itens da lista
    salvarDados();
    desenharTudo();
  }
}

// Apaga todos os registros
function limparRegistros() {
  if (dados.registros.length > 0 && confirm("Apagar TODOS os registros? Exporte antes se precisar.")) {
    dados.registros = [];
    salvarDados();
    desenharTudo();
  }
}


/* ---------- SEÇÃO 8: EXPORTAR PARA EXCEL ---------- */

function exportarExcel() {
  if (dados.registros.length === 0) {
    alert("Não há registros para exportar.");
    return;
  }

  // ----- Aba 1: "Registros" (uma linha para cada medição) -----
  // Cada linha é uma lista. A primeira é o cabeçalho.
  var linhasRegistros = [
    ["Referência", "Atividade", "Data", "Início", "Fim", "Duração (s)", "Duração (mm:ss)"]
  ];

  for (var i = 0; i < dados.registros.length; i++) {
    var r = dados.registros[i];
    var duracao = r.fim - r.inicio;

    linhasRegistros.push([
      r.referencia,
      r.atividade,
      formatarData(r.inicio),
      formatarHora(r.inicio),
      formatarHora(r.fim),
      Math.round(duracao / 1000),   // duração em segundos (número, bom para fazer contas)
      formatarTempo(duracao)
    ]);
  }

  // ----- Aba 2: "Resumo" (uma linha para cada atividade) -----
  var linhasResumo = [
    ["Atividade", "Qtd", "Média (s)", "Mín (s)", "Máx (s)", "Total (s)", "Média (mm:ss)"]
  ];

  // Primeiro descobre quais nomes de atividade existem nos registros (sem repetir)
  var nomesUsados = [];
  for (var j = 0; j < dados.registros.length; j++) {
    var nome = dados.registros[j].atividade;
    if (nomesUsados.indexOf(nome) === -1) {   // indexOf = -1 quer dizer "ainda não está na lista"
      nomesUsados.push(nome);
    }
  }

  // Depois calcula as estatísticas de cada nome
  for (var k = 0; k < nomesUsados.length; k++) {
    var stats = calcularEstatisticas(nomesUsados[k]);
    linhasResumo.push([
      nomesUsados[k],
      stats.quantidade,
      Math.round(stats.media / 1000),
      Math.round(stats.menor / 1000),
      Math.round(stats.maior / 1000),
      Math.round(stats.total / 1000),
      formatarTempo(stats.media)
    ]);
  }

  var nomeArquivo = "registro_tempo_atividades_" + formatarData(Date.now()).replace(/\//g, "-");

  // ----- Cria o arquivo Excel usando a biblioteca SheetJS -----
  if (window.XLSX) {
    var planilha = XLSX.utils.book_new();
    var abaRegistros = XLSX.utils.aoa_to_sheet(linhasRegistros);
    var abaResumo = XLSX.utils.aoa_to_sheet(linhasResumo);

    // Largura das colunas (só para ficar mais bonito)
    abaRegistros["!cols"] = [{wch:18},{wch:26},{wch:12},{wch:10},{wch:10},{wch:12},{wch:14}];
    abaResumo["!cols"] = [{wch:26},{wch:6},{wch:11},{wch:9},{wch:9},{wch:10},{wch:13}];

    XLSX.utils.book_append_sheet(planilha, abaRegistros, "Registros");
    XLSX.utils.book_append_sheet(planilha, abaResumo, "Resumo");
    XLSX.writeFile(planilha, nomeArquivo + ".xlsx");
  } else {
    // Plano B: se a biblioteca não carregou (sem internet), baixa em CSV
    var csv = "\ufeff";
    for (var m = 0; m < linhasRegistros.length; m++) {
      csv = csv + linhasRegistros[m].join(";") + "\n";
    }
    var link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    link.download = nomeArquivo + ".csv";
    link.click();
  }
}


/* ---------- SEÇÃO 9: EVENTOS E INÍCIO DO APP ---------- */

// Liga cada botão à sua função
document.getElementById("botaoExportar").onclick = exportarExcel;
document.getElementById("botaoAdicionar").onclick = adicionarAtividade;
document.getElementById("botaoLimpar").onclick = limparRegistros;

// Quando digita no campo de referência, guarda o texto
document.getElementById("campoReferencia").oninput = function (evento) {
  dados.referencia = evento.target.value;
  salvarDados();
};

// Faz os números dos cronômetros andarem (a cada 250 milissegundos)
setInterval(atualizarNumeros, 250);

// COMEÇO DO APP: carrega o que estava salvo e desenha a tela
carregarDados();
desenharTudo();
</script>
